<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestor Financeiro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:#0f172a;
  color:white;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

h1{
  margin-bottom:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 0 10px rgba(0,0,0,0.2);
}

input,
select,
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  margin-top:10px;
  font-size:15px;
}

input,
select{
  background:#0f172a;
  color:white;
  border:1px solid #334155;
}

button{
  background:#22c55e;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  opacity:0.9;
}

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #334155;
}

.item button{
  width:auto;
  padding:5px 10px;
  margin-left:10px;
  background:#ef4444;
}

.hist-item{
  background:#0f172a;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
  transition:0.2s;
}

.hist-item:hover{
  background:#334155;
}

.hist-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:bold;
}

.hist-top div{
  display:flex;
  align-items:center;
  gap:10px;
}

.hist-bottom{
  margin-top:5px;
  font-size:13px;
  opacity:0.7;
}

.entrada{
  color:#22c55e;
  font-weight:bold;
}

.saida{
  color:#ef4444;
  font-weight:bold;
}

.saldo-positivo{
  color:#22c55e;
}

.saldo-negativo{
  color:#ef4444;
}

</style>
</head>

<body>

<div class="container">

<h1>💰 Gestor Financeiro</h1>

<!-- ADICIONAR -->
<div class="card">

<h3>Adicionar Transação</h3>

<input id="desc" placeholder="Descrição">

<input id="valor" type="number" placeholder="Valor">

<select id="tipo">
  <option value="entrada">Salário / Entrada</option>
  <option value="variavel">Gasto Variável</option>
  <option value="fixo">Gasto Fixo</option>
  <option value="parcelado">Parcelado</option>
</select>

<input
  id="parcelas"
  type="number"
  placeholder="Quantidade de parcelas"
/>

<button onclick="adicionar()">
Adicionar
</button>

</div>

<!-- RESUMO -->
<div class="card">

<h3>Resumo Financeiro</h3>

<div id="resumo"></div>

</div>

<!-- GRAFICO -->
<div class="card">

<canvas id="grafico"></canvas>

</div>

<!-- TRANSAÇÕES -->
<div class="card">

<h3>Transações</h3>

<div id="lista"></div>

</div>

<!-- HISTORICO -->
<div class="card">

<h3>Histórico de Meses</h3>

<div id="historico"></div>

</div>

<!-- DETALHES -->
<div
  class="card"
  id="detalheMes"
  style="display:none;"
>

<h3>Detalhes do Mês</h3>

<div id="detalhes"></div>

</div>

<button onclick="fecharMes()">
Fechar Mês
</button>

</div>

<script>

let grafico;

// ===============================
// BUSCAR MÊS
// ===============================

async function gerarMes(){

  try{

    const res = await fetch("/mes");

    if(!res.ok){
      throw new Error("Erro ao carregar mês");
    }

    return await res.json();

  }catch(err){

    console.log(err);

    return [];
  }
}

// ===============================
// RENDER
// ===============================

async function render(){

  const dados = await gerarMes();

  const lista = document.getElementById("lista");

  lista.innerHTML = "";

  let entradas = 0;
  let saidas = 0;

  dados.forEach(d => {

    if(d.tipo === "entrada"){
      entradas += d.valor;
    }else{
      saidas += d.valor;
    }

    lista.innerHTML += `
    
      <div class="item">

        <div>
          ${d.desc}<br>

          <small>
            ${d.tipo}
            ${d.parcela || ""}
          </small>
        </div>

        <div>

          <span class="${
            d.tipo === "entrada"
            ? "entrada"
            : "saida"
          }">

            R$ ${d.valor}

          </span>

          ${
            d._id
            ? `<button onclick="deletar('${d._id}')">X</button>`
            : ""
          }

        </div>

      </div>

    `;
  });

  const saldo = entradas - saidas;

  document.getElementById("resumo").innerHTML = `

    <p>
      💵 Entradas:
      <strong class="entrada">
        R$ ${entradas.toFixed(2)}
      </strong>
    </p>

    <br>

    <p>
      💸 Gastos:
      <strong class="saida">
        R$ ${saidas.toFixed(2)}
      </strong>
    </p>

    <br>

    <p>
      🧠 Saldo:
      <strong class="${
        saldo >= 0
        ? "saldo-positivo"
        : "saldo-negativo"
      }">
        R$ ${saldo.toFixed(2)}
      </strong>
    </p>

  `;

  gerarGrafico(dados);

  carregarHistorico();
}

// ===============================
// GRAFICO
// ===============================

function gerarGrafico(dados){

  const entrada = dados
    .filter(d => d.tipo === "entrada")
    .reduce((a,b)=>a+b.valor,0);

  const fixo = dados
    .filter(d => d.tipo === "fixo")
    .reduce((a,b)=>a+b.valor,0);

  const variavel = dados
    .filter(d => d.tipo === "variavel")
    .reduce((a,b)=>a+b.valor,0);

  const parcelado = dados
    .filter(d => d.tipo === "parcelado")
    .reduce((a,b)=>a+b.valor,0);

  if(grafico){
    grafico.destroy();
  }

  grafico = new Chart(
    document.getElementById("grafico"),
    {
      type:"doughnut",

      data:{
        labels:[
          "Entrada",
          "Fixo",
          "Variável",
          "Parcelado"
        ],

        datasets:[{
          data:[
            entrada,
            fixo,
            variavel,
            parcelado
          ]
        }]
      }
    }
  );
}

// ===============================
// ADICIONAR
// ===============================

async function adicionar(){

  const desc = document
    .getElementById("desc")
    .value;

  const valor = Number(
    document.getElementById("valor").value
  );

  const tipo = document
    .getElementById("tipo")
    .value;

  const parcelas = Number(
    document.getElementById("parcelas").value
  );

  if(!desc || !valor){

    alert("Preencha os campos");

    return;
  }

  try{

    await fetch("/regras",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        descricao:desc,

        tipo,

        valor,

        valorParcela:valor,

        totalParcelas:parcelas || 0,

        parcelasPagas:0,

        ativo:true
      })
    });

    document.getElementById("desc").value = "";
    document.getElementById("valor").value = "";
    document.getElementById("parcelas").value = "";

    render();

  }catch(err){

    console.log(err);

    alert("Erro ao adicionar");
  }
}

// ===============================
// FECHAR MÊS
// ===============================

async function fecharMes(){

  const dados = await gerarMes();

  try{

    const res = await fetch("/fechar",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        mes:new Date()
          .toISOString()
          .slice(0,7),

        dados
      })
    });

    const json = await res.json();

    if(json.erro){

      alert(json.erro);

      return;
    }

    alert("Mês fechado!");

    render();

  }catch(err){

    console.log(err);

    alert("Erro ao fechar mês");
  }
}

// ===============================
// HISTORICO
// ===============================

async function carregarHistorico(){

  try{

    const res = await fetch("/historico");

    const meses = await res.json();

    const div = document.getElementById("historico");

    div.innerHTML = "";

    meses.forEach(m => {

      div.innerHTML += `

        <div class="hist-item">

          <div class="hist-top">

            <span
              onclick="verDetalhe('${m._id}')"
              style="cursor:pointer;"
            >
              ${m.mes}
            </span>

            <div>

              <span>
                R$ ${m.total}
              </span>

              <button
                onclick="deletarMes('${m._id}')"
              >
                🗑️
              </button>

            </div>

          </div>

          <div class="hist-bottom">
            Clique para ver detalhes
          </div>

        </div>

      `;
    });

  }catch(err){

    console.log(err);
  }
}

// ===============================
// VER DETALHE
// ===============================

async function verDetalhe(id){

  const res = await fetch("/historico");

  const meses = await res.json();

  const mes = meses.find(
    m => m._id === id
  );

  const div = document.getElementById("detalhes");

  const box = document.getElementById("detalheMes");

  box.style.display = "block";

  div.innerHTML = "";

  mes.dados.forEach(d => {

    div.innerHTML += `

      <div class="item">

        <div>

          ${d.desc}<br>

          <small>
            ${d.tipo}
            ${d.parcela || ""}
          </small>

        </div>

        <div>

          R$ ${d.valor}

        </div>

      </div>

    `;
  });
}

// ===============================
// DELETAR REGRA
// ===============================

async function deletar(id){

  if(!confirm("Deseja excluir?")){
    return;
  }

  await fetch(`/regras/${id}`,{
    method:"DELETE"
  });

  render();
}

// ===============================
// DELETAR MÊS
// ===============================

async function deletarMes(id){

  if(!confirm("Deseja apagar este mês?")){
    return;
  }

  await fetch(`/historico/${id}`,{
    method:"DELETE"
  });

  carregarHistorico();
}

// ===============================
// INIT
// ===============================

render();

</script>

</body>
</html>
